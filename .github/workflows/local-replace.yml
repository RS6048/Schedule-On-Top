name: local-replace

on:
  push:
    paths:
      - '.replace/payload.b64'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply local files
        run: |
          set -e
          base64 -d .replace/payload.b64 | gunzip > /tmp/local.patch
          git apply -v /tmp/local.patch
          rm -rf .replace
          rm -f .github/workflows/local-replace.yml
          git config user.name "RS6048"
          git config user.email "rs6048@qq.com"
          git add -A
          git commit -m "v1.8.0(local): 以本地工程为准直接替换（4/4：Main/MainFrame/UpdateChecker）"
          git push origin HEAD:main
