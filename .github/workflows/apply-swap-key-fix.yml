name: apply-swap-key-fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-swap-key-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download payload
        run: curl -fsSL -o /tmp/swap.zip "https://aka.doubaocdn.com/s/xevgkSskxx"
      - name: Unzip payload
        run: unzip -o /tmp/swap.zip -d .
      - name: Remove stale replace dir
        run: rm -rf .replace
      - name: Commit and push
        run: |
          rm -f .github/workflows/apply-swap-key-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "swap.txt: name uses full_name single-char key; space means break"
          git push origin HEAD:main
