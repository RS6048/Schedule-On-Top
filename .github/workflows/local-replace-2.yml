name: local-replace-2

on:
  push:
    paths:
      - '.replace/go.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply local files
        run: |
          set -e
          git config user.name "RS6048"
          git config user.email "rs6048@qq.com"
          cat .replace/p1.b64 .replace/p2.b64 .replace/p3.b64 .replace/p4.b64 | tr -d '\n' | base64 -d | gunzip > /tmp/local.patch
          git apply -v /tmp/local.patch
          printf 'cd out\\production\\ScrollSched\r\njar cvfe sc.jar Main .\r\nmove sc.jar D:\\ScrollSched\r\n@pause' > BuildJar.bat
          rm -rf .replace
          rm -f .github/workflows/local-replace.yml .github/workflows/local-replace-2.yml
          git add -A
          git commit -m "v1.8.0(local): 以本地工程为准直接替换（4/4：Main/MainFrame/UpdateChecker）"
          git push origin HEAD:main
